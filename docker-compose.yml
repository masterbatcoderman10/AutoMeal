services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: mealttracker-postgres
    environment:
      POSTGRES_DB: mealttracker
      POSTGRES_USER: mealttracker
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mealttracker -d mealttracker"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: mealttracker-api
    environment:
      DATABASE_URL: postgresql+asyncpg://mealttracker:${POSTGRES_PASSWORD}@postgres:5432/mealttracker
      INGEST_SECRET: ${INGEST_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      SEARXNG_URL: http://searxng:8080
      FIRECRAWL_URL: http://firecrawl:3002
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: mealttracker-bot
    environment:
      DATABASE_URL: postgresql+asyncpg://mealttracker:${POSTGRES_PASSWORD}@postgres:5432/mealttracker
      INGEST_SECRET: ${INGEST_SECRET}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      BOT_POLL_INTERVAL: 3
    volumes:
      - uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  searxng:
    image: searxng/searxng:latest
    container_name: mealttracker-searxng
    environment:
      SEARXNG_BASE_URL: http://searxng:8080/
      SEARXNG_SECRET: ${SEARXNG_SECRET:-changeme}
    volumes:
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro

  firecrawl:
    image: devflowinc/firecrawl-simple:latest
    container_name: mealttracker-firecrawl
    environment:
      REDIS_URL: redis://firecrawl-redis:6379
      FIRECRAWL_PASSWORD: ${FIRECRAWL_PASSWORD:-changeme}
    depends_on:
      - firecrawl-redis

  firecrawl-redis:
    image: redis:7-alpine
    container_name: mealttracker-firecrawl-redis

volumes:
  postgres_data:
  uploads:
